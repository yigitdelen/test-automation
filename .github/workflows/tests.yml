name: Testler

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # her gece 03:17 UTC (Türkiye saatiyle 06:17)
  workflow_dispatch: # GitHub'da "Run workflow" butonuyla elle çalıştırmak için

# Aynı dala art arda push yapılırsa eski çalışmayı iptal et, sadece en yenisini çalıştır
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Kod stili (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.6"
      - name: Hata denetimi
        run: ruff check .
      - name: Biçim denetimi
        run: ruff format --check .

  api:
    name: API testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # -n 4: 4 test paralel çalışır. --reruns 2: ağ kaynaklı geçici hatalarda testi 2 kez daha dener.
      - name: Testleri çalıştır
        run: pytest -m api -n 4 --reruns 2 --reruns-delay 3 --html=reports/api-report.html

      - name: HTML raporu yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-rapor-api
          path: reports/api-report.html
          retention-days: 14
      - name: Allure sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: reports/allure-results
          retention-days: 3

  ui:
    name: UI testleri (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # bir tarayıcıda kalsa bile diğeri çalışmaya devam etsin
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # GitHub'ın Ubuntu makinelerinde Chrome ve Firefox hazır kurulu;
      # uygun sürücüyü (chromedriver / geckodriver) Selenium Manager kendisi bulur.
      - name: Testleri çalıştır
        run: >-
          pytest -m ui --browser ${{ matrix.browser }} -n 4 --reruns 1
          --html=reports/ui-${{ matrix.browser }}-report.html

      - name: HTML raporu ve ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-rapor-ui-${{ matrix.browser }}
          path: |
            reports/ui-${{ matrix.browser }}-report.html
            reports/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Allure sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 3

  report:
    name: Allure raporu
    needs: [api, ui]
    # Testler kalsa bile rapor oluşturulsun; PR'larda yayınlama yapılmasın
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Tüm Allure sonuçlarını indir ve birleştir
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Ortam bilgisini güncelle (iki tarayıcı birlikte çalıştı)
        run: sed -i 's/^Tarayıcı=.*/Tarayıcı=chrome, firefox/' allure-results/environment.properties

      - name: Allure raporunu oluştur
        run: npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report

      - name: Raporu indirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v7
        with:
          name: allure-raporu
          path: allure-report
          retention-days: 14

      # GitHub Pages açık değilse bu adımlar kalır ama testlerin sonucunu etkilemez.
      # Açmak için: Settings -> Pages -> Source: "GitHub Actions"
      - name: GitHub Pages'i hazırla
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Raporu Pages için paketle
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - name: Raporu yayınla
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5
